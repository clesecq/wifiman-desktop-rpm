name: Build RPM

on:
  push:
    branches: [main]
    tags: ['wifiman-desktop-*']
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        description: Release tag to build and publish
        required: true
        type: string

permissions:
  contents: read

env:
  # set when called from tag.yml, whose github.ref is still the branch
  RELEASE_TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}

jobs:
  build:
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:latest
    steps:
      # git must exist before checkout, otherwise no .git directory for tito
      - name: Install build tools
        run: dnf install -y --setopt=install_weak_deps=False tito rpm-build rpmdevtools dnf-plugins-core git

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || '' }}
          fetch-depth: 0

      - name: Mark workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # checkout replaces annotated tags with lightweight ones; tito then sees a mismatch with origin
      - name: Restore annotated tags
        run: git fetch --force --tags origin

      - name: Install build dependencies
        run: dnf builddep -y wifiman-desktop.spec

      - name: Build test RPM from HEAD
        if: env.RELEASE_TAG == ''
        run: tito build --rpm --test -o dist

      - name: Build release RPM from tag
        if: env.RELEASE_TAG != ''
        run: tito build --rpm --tag "$RELEASE_TAG" -o dist

      - uses: actions/upload-artifact@v4
        with:
          name: rpms
          path: dist/**/*.rpm
          if-no-files-found: error

  release:
    if: inputs.tag || startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: rpms
          path: dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          gh release create "$TAG" $(find dist -name '*.rpm') \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --generate-notes
